AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: charity-csv-upload

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true

Resources:
  IrsImportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: charity-etl/
      Handler: app.handler
      Runtime: nodejs24.x
      Timeout: 900
      MemorySize: 1024
      LoggingConfig:
        LogFormat: JSON
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
      Architectures:
        - x86_64

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - app.ts